[pytest]
# Bare `pytest` at the repository root used to collect 3568 items plus a fistful of errors:
# the root has ~700 experiment scripts, 41 of them named test_*.py, and several of those load
# models or assert GPU idle at import time. pylib collects by filename, so they were treated
# as tests. They are research scripts, not a suite; the real suite is bitsandbytes/tests.
#
# Keep this file at the root: it is the only place pytest looks when the invocation starts
# here, and rootdir-based discovery otherwise walks the whole tree.
testpaths = bitsandbytes/tests
norecursedirs = scripts gt1030 i5build .git build dist dist_windows dist_linux _repo_archive_2026-10-27 cache_latents
