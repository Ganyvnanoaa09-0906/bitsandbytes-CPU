[build-system]
# Pure setuptools, deliberately.
#
# The inherited configuration used scikit-build-core and drove CMake, because
# upstream builds the CUDA kernels from source during the wheel build. This fork's
# artefact for Windows is a hand-built CPU DLL that is already in the tree, so a
# CMake step would rebuild nothing while adding two build dependencies
# (scikit-build-core, cmake) that a user installing from a wheel never needs --
# and that were not even present on the development machine.
#
# The upstream configuration is kept beside this file as
# pyproject.upstream-cuda.toml.bak for reference.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name differs from the import name on purpose: `import bitsandbytes`
# must keep working so that transformers / peft / diffusers integrations find it
# unchanged, while the distribution must not collide with upstream bitsandbytes on
# PyPI.
name = "bitsandbytes-cpu-fork"
dynamic = ["version"]
description = "bitsandbytes with a pure-CPU training backend (AVX2 / NEON): 8-bit optimizers, fused GDN, gemm_8bit, disk balancer. No GPU required."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "cpu",
    "optimizers",
    "optimization",
    "8-bit",
    "quantization",
    "compression",
    "avx2",
    "neon",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4,<3",
    "numpy>=1.17",
    "packaging>=20.9",
]

[project.optional-dependencies]
# Not the upstream test set: those tests build CUDA kernels. These are the checks
# that are meaningful for a CPU-only install.
test = [
    "pytest~=8.3",
    "psutil>=5.9",
]

[project.urls]
repository = "https://github.com/Ganyvnanoaa09-0906/bitsandbytes-CPU"
# Upstream project this fork is based on (v0.45.1, MIT).
"Upstream bitsandbytes" = "https://github.com/bitsandbytes-foundation/bitsandbytes"

[tool.setuptools.dynamic]
version = {attr = "bitsandbytes.__version__"}

[tool.setuptools.packages.find]
include = ["bitsandbytes*"]

[tool.setuptools.package-data]
# The prebuilt CPU DLL and its OpenMP runtime ship inside the wheel, so an
# installing user needs no compiler and no Visual C++ Redistributable:
#   libbitsandbytes_cpu.dll  imports VCOMP140.DLL (checked with dumpbin /dependents)
#   vcomp140.dll             provides it
"bitsandbytes" = ["libbitsandbytes*.dll", "libbitsandbytes*.so", "vcomp140.dll", "py.typed"]
