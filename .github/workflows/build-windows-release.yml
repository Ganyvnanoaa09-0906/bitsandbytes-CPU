name: build-windows-release

# 在 GitHub 的 windows-latest runner 上编译 Windows 预编译包。
# push 到 main/master 时产出 artifact；打 tag（如 v1.0.0）时上传到 GitHub Release。
#
# 产物：dist_windows/bitsandbytes-cpu-win_<ver>.zip（含 libbitsandbytes_cpu.dll + vcomp140 +
#       全部灾难工具 exe + 双语文档）
# 依赖：windows-latest 自带 Visual Studio MSVC（cl）+ PowerShell。

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write    # 打 tag 时上传预编译包到 GitHub Release 需要这个权限

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSVC to PATH (vcvars64) and build Windows package
        shell: pwsh
        run: |
          # 定位 vcvars64.bat（windows-latest 有二种可能路径）
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $inst = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Get-ChildItem -Path (Join-Path $inst "VC\Auxiliary\Build") -Filter vcvars64.bat | Select-Object -First 1
          if (-not $vcvars) { throw "vcvars64.bat not found" }
          Write-Host "MSVC: $($vcvars.FullName)"

          # 在 vcvars64 环境里执行构建脚本（先设环境，再单独跑批处理，避免 cmd 链断）
          cmd /c "call `"$($vcvars.FullName)`" && cd /d bitsandbytes && build_manual\build_manual.bat amd"
          $batExit = $LASTEXITCODE
          # 吞掉 cmd 的非0退出码（build_manual.bat 的工具 batch 可能因 cmd 解析报
          # '... was unexpected' 而返回 255，但核心 DLL 已成功生成）；成功与否只由下面
          # 是否找到 DLL 判定，避免这个环境相关退出码让整个 job 失败。
          $null = $batExit

          # 核心判定：只要 DLL 编译成功就算构建通过（灾难工具是可选、非致命）。
          # 用递归定位 DLL（build_manual.bat 的目录定位在不同环境下可能不同；[2/2]
          # 已确认生成，这里找到它即可）。
          $dll = Get-ChildItem -Path . -Recurse -Filter "libbitsandbytes_cpu.dll" -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match "bitsandbytes[\\/]bitsandbytes[\\/]libbitsandbytes_cpu.dll" -or $_.Name -eq "libbitsandbytes_cpu.dll" } |
                 Select-Object -First 1
          if (-not $dll) {
            Write-Host "build_manual.bat 未生成 DLL（退出码=$batExit）；尝试直接用 cl 编译核心 DLL ..."
            cmd /c "call `"$($vcvars.FullName)`" && cd /d bitsandbytes && cl /nologo /O2 /Ob2 /arch:AVX2 /fp:fast /openmp:experimental /GL /Qpar /favor:AMD64 /std:c++17 /EHsc /utf-8 /DNOMINMAX /DNDEBUG /DWIN32 /D_WINDOWS /MT /I csrc /LD csrc\cpu_ops.cpp csrc\cpu_gdn.cpp csrc\pythonInterface.cpp /Fe:bitsandbytes\libbitsandbytes_cpu.dll /link /LTCG /DEF:build_manual\export.def"
            $dll = Get-ChildItem -Path . -Recurse -Filter "libbitsandbytes_cpu.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $dll) { throw "核心 DLL 仍未能生成（cl 直编退出码=$LASTEXITCODE）；无法打包 CPU 预编译包。" }
            Write-Host "[OK] 核心 DLL 由 cl 直编生成"
          } else {
            Write-Host "[OK] 核心 DLL 生成：$($dll.FullName)  (build_manual.bat 退出码=$batExit；工具可容错)"
          }
          # 显式以 0 退出：覆盖上面 cmd /c（build_manual.bat 工具 batch 报 '... was
          # unexpected' 返回 255）导致的 native 退出码，否则 GitHub Actions 的 pwsh step
          # 会以那个非0作为整个构建失败，尽管 DLL 已成功生成。
          if ($dll) { exit 0 } else { exit 1 }

      - name: Run Windows release packager
        shell: pwsh
        run: |
          cd bitsandbytes
          # 用已编译的 DLL 直接打包（避免重复编译，用 --NoZip 之外的组装逻辑）
          # 若 build_release_windows.ps1 依赖本地 vcvars 路径，这里改由 CI 环境变量注入。
          powershell -ExecutionPolicy Bypass -File build_release_windows.ps1 --NoZip
          if ($LASTEXITCODE -ne 0) { throw "build_release_windows.ps1 failed" }

      - name: Zip the release dir
        shell: pwsh
        run: |
          # 当前目录是 checkout 根；packager(s4) 在 bitsandbytes\ 里生成了 dist_windows\。
          $dw = "bitsandbytes/dist_windows"
          $stage = Get-ChildItem $dw -Directory | Select-Object -First 1
          if (-not $stage) { throw "未找到发布目录（$dw）" }
          $ver = $stage.Name
          $zip = Join-Path $dw "$ver.zip"
          Compress-Archive -Path (Join-Path $stage.FullName "*") -DestinationPath $zip -Force
          Get-ChildItem $dw\*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitsandbytes-cpu-windows
          path: bitsandbytes/dist_windows/*.zip
          if-no-files-found: warn

      - name: Upload to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bitsandbytes/dist_windows/*.zip
          fail_on_unmatched_files: true
